<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuizMaster — Twoje prywatne fiszki</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
</head>
<body>
  <header class="topbar">
    <button class="brand" id="brandBtn" title="Strona główna">
      <span class="brand-icon">🧠</span>
      <span class="brand-name">QuizMaster</span>
      <span class="brand-tag">prywatne fiszki</span>
    </button>
    <div class="topbar-actions">
      <button class="btn btn-ghost" id="importJsonBtn" title="Importuj zestawy z pliku JSON">⬆ Import</button>
      <button class="btn btn-ghost" id="exportJsonBtn" title="Eksportuj wszystkie zestawy do JSON">⬇ Eksport</button>
      <button class="btn btn-primary" id="newSetBtn">+ Nowy zestaw</button>
    </div>
  </header>

  <main id="app" class="container"></main>

  <footer class="footer">
    QuizMaster — prywatna alternatywa dla Quizleta. Dane są zapisywane wyłącznie w Twojej przeglądarce (localStorage). Bez kont, bez limitów, bez reklam.
  </footer>

  <input type="file" id="importFileInput" accept="application/json,.json" hidden>
  <div id="toast" class="toast" hidden></div>

  <script src="js/app.js"></script>
</body>
</html>
