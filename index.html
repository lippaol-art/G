<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#636363" />
<title>Matura 2027</title>
<style>
  :root{
    --gray:#636363;
    --gray-d:#4a4a4a;
    --gray-l:#8a8a8a;
    --bg:#f4f4f3;
    --card:#ffffff;
    --line:#e3e3e1;
    --text:#2e2e2e;
    --muted:#7a7a7a;
    --todo:#d8d8d6;
    --todo-t:#8a8a8a;
    --doing:#e8a33d;
    --doing-bg:#fbf0db;
    --done:#5a8a63;
    --done-bg:#e6efe7;
    --radius:14px;
    --shadow:0 1px 2px rgba(0,0,0,.06),0 1px 8px rgba(0,0,0,.04);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);
    line-height:1.5;font-size:15px;
    padding-bottom:calc(72px + env(safe-area-inset-bottom));
  }
  a{color:var(--gray-d);}
  h1,h2,h3,h4{margin:0;font-weight:700;color:var(--text);}
  .wrap{max-width:760px;margin:0 auto;padding:14px;}

  /* Top bar */
  header.topbar{
    position:sticky;top:0;z-index:50;
    background:var(--gray);color:#fff;
    padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));
    box-shadow:var(--shadow);
  }
  .topbar-inner{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .topbar h1{color:#fff;font-size:18px;letter-spacing:.3px;}
  .topbar .sub{font-size:12px;opacity:.85;font-weight:400;}
  .countdown{background:rgba(255,255,255,.15);border-radius:10px;padding:6px 10px;text-align:center;line-height:1.1;}
  .countdown b{font-size:18px;display:block;}
  .countdown span{font-size:10px;opacity:.9;text-transform:uppercase;letter-spacing:.5px;}

  /* Desktop nav */
  nav.topnav{display:none;background:#fff;border-bottom:1px solid var(--line);}
  nav.topnav .topnav-inner{max-width:760px;margin:0 auto;display:flex;gap:4px;padding:6px;}
  nav.topnav button{
    flex:1;background:none;border:none;padding:10px 8px;border-radius:10px;
    font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;
  }
  nav.topnav button.active{background:var(--bg);color:var(--gray-d);}

  /* Bottom nav (mobile) */
  nav.bottomnav{
    position:fixed;bottom:0;left:0;right:0;z-index:50;
    background:#fff;border-top:1px solid var(--line);
    display:flex;padding-bottom:env(safe-area-inset-bottom);
    box-shadow:0 -1px 8px rgba(0,0,0,.05);
  }
  nav.bottomnav button{
    flex:1;background:none;border:none;padding:8px 2px 6px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--todo-t);font-size:10px;font-weight:600;
  }
  nav.bottomnav button .ico{font-size:20px;line-height:1;}
  nav.bottomnav button.active{color:var(--gray-d);}

  /* Cards & sections */
  .section-title{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:22px 4px 10px;font-weight:700;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:10px;}
  .card.pad0{padding:0;overflow:hidden;}

  /* Progress bars */
  .pbar{height:10px;background:var(--todo);border-radius:99px;overflow:hidden;}
  .pbar > i{display:block;height:100%;background:var(--gray);border-radius:99px;transition:width .35s ease;}
  .pbar.done > i{background:var(--done);}
  .pbar.big{height:14px;}
  .prow{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .prow .lab{font-weight:600;font-size:14px;}
  .prow .val{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700;font-size:13px;}
  .mini-grid{display:grid;grid-template-columns:1fr;gap:12px;}

  /* Topic rows */
  .acc{margin-bottom:10px;}
  .acc-head{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:13px 14px;cursor:pointer;box-shadow:var(--shadow);
  }
  .acc-head .ttl{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;}
  .acc-head .ttl .chev{transition:transform .25s;color:var(--muted);font-size:12px;}
  .acc.open .acc-head .ttl .chev{transform:rotate(90deg);}
  .acc-head .meta{display:flex;align-items:center;gap:10px;}
  .acc-head .cnt{font-size:12px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums;}
  .acc-head .ring{width:34px;height:34px;flex:0 0 34px;}
  .acc-body{display:none;padding:6px 2px 2px;}
  .acc.open .acc-body{display:block;}

  .topic{
    display:flex;align-items:center;gap:11px;background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-top:8px;
  }
  .topic .stat{
    flex:0 0 26px;width:26px;height:26px;border-radius:8px;border:2px solid var(--todo);
    display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;background:#fff;color:transparent;
    transition:.15s;user-select:none;
  }
  .topic.s50 .stat{border-color:var(--doing);background:var(--doing-bg);color:var(--doing);}
  .topic.s100 .stat{border-color:var(--done);background:var(--done);color:#fff;}
  .topic .body{flex:1;min-width:0;}
  .topic{cursor:pointer;}
  .topic .name{font-weight:600;font-size:14px;}
  .topic.s100 .name{color:var(--muted);}
  .topic .note{font-size:12px;color:var(--muted);margin-top:1px;}
  .topic .lnk{font-size:12px;color:var(--gray-d);text-decoration:none;margin-top:3px;display:inline-block;font-weight:600;}
  .topic .lnk:after{content:" ↗";opacity:.6;}
  .topic.bold .name:before{content:"★ ";color:var(--doing);}

  /* Pills / chips */
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .chip{font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:4px 10px;color:var(--muted);font-weight:600;}

  /* Tables */
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;}
  tr.total td{font-weight:800;border-bottom:none;border-top:2px solid var(--gray);}

  /* Counter */
  .counter{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-top:10px;}
  .counter .btn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:22px;font-weight:700;color:var(--gray-d);cursor:pointer;line-height:1;}
  .counter .num{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;}
  .counter .num small{font-size:14px;color:var(--muted);font-weight:600;}
  input[type=range]{width:100%;accent-color:var(--gray);margin-top:10px;}

  /* Timeline */
  .phase{position:relative;padding-left:26px;margin-bottom:14px;}
  .phase:before{content:"";position:absolute;left:7px;top:6px;bottom:-14px;width:2px;background:var(--line);}
  .phase:last-child:before{display:none;}
  .phase .dot{position:absolute;left:0;top:4px;width:16px;height:16px;border-radius:99px;background:#fff;border:3px solid var(--todo);}
  .phase.current .dot{border-color:var(--gray);background:var(--gray);box-shadow:0 0 0 4px rgba(99,99,99,.15);}
  .phase.done .dot{border-color:var(--done);background:var(--done);}
  .phase .when{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;}
  .phase .pttl{font-size:16px;font-weight:800;margin:2px 0 2px;}
  .badge-now{display:inline-block;background:var(--gray);color:#fff;font-size:10px;padding:2px 8px;border-radius:99px;margin-left:8px;vertical-align:middle;letter-spacing:.5px;}
  .check{display:flex;align-items:flex-start;gap:9px;padding:7px 0;border-bottom:1px solid var(--line);}
  .check:last-child{border-bottom:none;}
  .check .box{flex:0 0 22px;width:22px;height:22px;border:2px solid var(--todo);border-radius:7px;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;margin-top:1px;}
  .check.on .box{background:var(--done);border-color:var(--done);}
  .check .txt{flex:1;font-size:13.5px;}
  .check.on .txt{color:var(--muted);text-decoration:line-through;}
  .checkpoint{background:var(--bg);border-radius:10px;padding:9px 11px;font-size:12.5px;margin-top:10px;border-left:3px solid var(--gray);}

  /* Shopping */
  .shop{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);}
  .shop:last-child{border-bottom:none;}
  .shop .box{flex:0 0 24px;width:24px;height:24px;border:2px solid var(--todo);border-radius:7px;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;}
  .shop.on .box{background:var(--done);border-color:var(--done);}
  .shop .body{flex:1;min-width:0;}
  .shop .nm{font-size:14px;font-weight:600;}
  .shop.on .nm{color:var(--muted);text-decoration:line-through;}
  .shop .pr{font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--gray-d);}
  .budget{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}
  .budget .box2{flex:1;min-width:140px;background:var(--bg);border-radius:12px;padding:12px;text-align:center;}
  .budget .box2 b{display:block;font-size:22px;font-weight:800;}
  .budget .box2 span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}

  /* Links */
  .link{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:9px;box-shadow:var(--shadow);}
  .link .nm{font-weight:700;font-size:14px;color:var(--gray-d);}
  .link .ds{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .link .url{font-size:11px;color:var(--gray-l);margin-top:4px;word-break:break-all;}

  .note{font-size:12.5px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 12px;margin-top:10px;}
  .note b{color:var(--text);}

  .btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .btn-line{flex:1;min-width:120px;padding:11px;border-radius:11px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:13px;color:var(--gray-d);cursor:pointer;}
  .btn-line.danger{color:#b04a4a;border-color:#e8cccc;}

  .view{display:none;}
  .view.active{display:block;animation:fade .2s ease;}
  @keyframes fade{from{opacity:.4;transform:translateY(4px);}to{opacity:1;transform:none;}}

  @media(min-width:760px){
    nav.topnav{display:block;}
    nav.bottomnav{display:none;}
    body{padding-bottom:30px;}
    .mini-grid{grid-template-columns:repeat(3,1fr);}
  }
  .hint{text-align:center;font-size:11px;color:var(--gray-l);margin:18px 0 6px;}
</style>
</head>

/* ===== STAN ===== */
let state = loadState();

function defaultState(){
  const topics = {};
  allTopicIds().forEach(id=>topics[id]=0);
  return {topics, jawne:0, checks:{}, shop:{}, free:{}, openAcc:{}};
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const s = JSON.parse(raw);
    const d = defaultState();
    return {
      topics: Object.assign(d.topics, s.topics||{}),
      jawne: typeof s.jawne==="number"?s.jawne:0,
      checks: s.checks||{}, shop: s.shop||{}, free: s.free||{}, openAcc: s.openAcc||{},
    };
  }catch(e){ return defaultState(); }
}
function save(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }

/* ===== POMOCNICZE ===== */
const $ = (s,el=document)=>el.querySelector(s);
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function avg(arr){ return arr.length? Math.round(arr.reduce((a,b)=>a+b,0)/arr.length) : 0; }
function topicPcts(ids){ return ids.map(id=>state.topics[id]||0); }

function mathProgress(){ return avg(topicPcts([...MAT_PP.map(x=>x[0]),...MAT_PR.map(x=>x[0])])); }
function polishProgress(){
  const ids = [...POL_FORM.map(x=>x[0]),...POL_LEKT.map(x=>x[0]),...POL_LEKT_PP.map(x=>x[0])];
  const arr = topicPcts(ids);
  arr.push(Math.round(state.jawne/76*100)); // pytania jawne jako jeden ważony element
  return avg(arr);
}
function englishProgress(){
  return avg(topicPcts([...ANG_GRAM.map(x=>x[0]),...ANG_EGZ.map(x=>x[0]),...ANG_PIS.map(x=>x[0]),...ANG_USTNY.map(x=>x[0])]));
}
function overallProgress(){
  const arr = topicPcts(allTopicIds());
  arr.push(Math.round(state.jawne/76*100));
  return avg(arr);
}
function groupProgress(ids){ return avg(topicPcts(ids)); }

function pbar(pct,big){
  const done = pct>=100;
  return `<div class="pbar${big?" big":""}${done?" done":""}"><i style="width:${pct}%"></i></div>`;
}
function ringSvg(pct){
  const r=14,c=2*Math.PI*r,off=c*(1-pct/100);
  const col = pct>=100?"var(--done)":(pct>0?"var(--gray)":"var(--todo)");
  return `<svg class="ring" viewBox="0 0 34 34"><circle cx="17" cy="17" r="${r}" fill="none" stroke="var(--todo)" stroke-width="4"/>
    <circle cx="17" cy="17" r="${r}" fill="none" stroke="${col}" stroke-width="4" stroke-linecap="round"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 17 17)"/>
    <text x="17" y="20" text-anchor="middle" font-size="9" font-weight="700" fill="var(--gray-d)">${pct}</text></svg>`;
}

function topicRow(t){
  const [id,name,note,resName,url]=t;
  const st=state.topics[id]||0;
  const cls = st===100?"s100":(st===50?"s50":"");
  const icon = st===100?"✓":(st===50?"◑":"");
  return `<div class="topic ${cls}" data-topic="${id}">
    <div class="stat" data-toggle="${id}">${icon}</div>
    <div class="body">
      <div class="name">${esc(name)}</div>
      ${note?`<div class="note" style="background:none;padding:0;margin:2px 0 0">${esc(note)}</div>`:""}
      ${resName?`<a class="lnk" href="${url}" target="_blank" rel="noopener">${esc(resName)}</a>`:""}
    </div>
  </div>`;
}
function lektRow(item){
  const [id,name,bold]=item;
  const st=state.topics[id]||0;
  const cls = (st===100?"s100":(st===50?"s50":"")) + (bold?" bold":"");
  const icon = st===100?"✓":(st===50?"◑":"");
  return `<div class="topic ${cls}" data-topic="${id}">
    <div class="stat" data-toggle="${id}">${icon}</div>
    <div class="body"><div class="name">${esc(name)}</div></div>
  </div>`;
}
function accordion(key,title,subnote,ids,bodyHtml){
  const pct=groupProgress(ids);
  const open=!!state.openAcc[key];
  const doneCount=ids.filter(id=>(state.topics[id]||0)===100).length;
  return `<div class="acc${open?" open":""}" data-acc="${key}">
    <div class="acc-head" data-acchead="${key}">
      <div class="ttl"><span class="chev">▶</span>${esc(title)}</div>
      <div class="meta"><span class="cnt">${doneCount}/${ids.length}</span>${ringSvg(pct)}</div>
    </div>
    <div class="acc-body">
      ${subnote?`<div class="note">${subnote}</div>`:""}
      ${bodyHtml}
    </div>
  </div>`;
}

  ${accordion("ang-ustny","Ustny","", angU, ANG_USTNY.map(topicRow).join(""))}
  <div class="hint">Dotknij kartę tematu: do zrobienia → w trakcie → zrobione.</div>
  `;

  // accordion toggles
  el.querySelectorAll("[data-acchead]").forEach(h=>h.addEventListener("click",()=>{
    const k=h.dataset.acchead; state.openAcc[k]=!state.openAcc[k]; save();
    el.querySelector(`[data-acc="${k}"]`).classList.toggle("open",state.openAcc[k]);
  }));
  // topic toggles — kliknięcie w kartę przełącza status (poza linkiem do zasobu)
  el.querySelectorAll("[data-topic]").forEach(row=>row.addEventListener("click",(e)=>{
    if(e.target.closest("a")) return; // nie przełączaj, gdy klik w link
    const id=row.dataset.topic;
    state.topics[id]=((state.topics[id]||0)+50)%150; // 0->50->100->0
    save(); renderMap(); renderDashIfActive();
  }));
  // jawne controls
  const setJ=(v)=>{ state.jawne=Math.max(0,Math.min(76,v)); save(); renderMap(); renderDashIfActive(); };
  $("#jw-minus").addEventListener("click",()=>setJ(state.jawne-1));
  $("#jw-plus").addEventListener("click",()=>setJ(state.jawne+1));
  $("#jw-range").addEventListener("input",(e)=>setJ(parseInt(e.target.value,10)));
}
function renderDashIfActive(){ if(currentView==="dash") renderDash(); }

/* ===== RENDER: OŚ CZASU ===== */
function currentPhaseId(){
  const today=new Date(); today.setHours(0,0,0,0);
  for(const ph of PHASES){
    const s=new Date(ph.start+"T00:00:00"), e=new Date(ph.end+"T00:00:00");
    if(today>=s && today<=e) return ph.id;
  }
  if(today < new Date(PHASES[0].start+"T00:00:00")) return null;
  return PHASES[PHASES.length-1].id;
}
function renderTime(){
  const el=$("#view-time");
  const curId=currentPhaseId();
  const today=new Date(); today.setHours(0,0,0,0);
  let html=`<div class="section-title">Oś czasu — 4 fazy</div>`;
  PHASES.forEach(ph=>{
    const done = today > new Date(ph.end+"T00:00:00");
    const isCur = ph.id===curId;
    const total=ph.tasks.length;
    const ck=ph.tasks.filter(t=>state.checks[t[0]]).length;
    html+=`<div class="phase ${isCur?"current":""} ${done&&!isCur?"done":""}">
      <div class="dot"></div>
      <div class="when">${esc(ph.when)}</div>
      <div class="pttl">${esc(ph.title)}${isCur?'<span class="badge-now">TERAZ</span>':''}</div>
      <div class="card" style="margin-top:8px">
        <div class="prow"><div class="lab" style="font-size:13px">Zadania</div><div class="val">${ck}/${total}</div></div>
        ${pbar(total?Math.round(ck/total*100):0)}
        <div style="margin-top:8px">
          ${ph.tasks.map(t=>`<div class="check ${state.checks[t[0]]?"on":""}" data-check="${t[0]}">
            <div class="box">${state.checks[t[0]]?"✓":""}</div><div class="txt">${esc(t[1])}</div></div>`).join("")}
        </div>
        <div class="checkpoint">${esc(ph.checkpoint)}</div>
      </div>
    </div>`;
  });
  el.innerHTML=html;
  el.querySelectorAll("[data-check]").forEach(c=>c.addEventListener("click",()=>{
    const id=c.dataset.check; state.checks[id]=!state.checks[id]; save(); renderTime();
  }));
}

/* ===== RENDER: ZAKUPY ===== */
function renderShop(){
  const el=$("#view-shop");
  let total=0, spent=0;
  SHOP.forEach(g=>g.items.forEach(it=>{ total+=it[2]; if(state.shop[it[0]]) spent+=it[2]; }));
  const left=total-spent;

  let html=`<div class="section-title">Budżet</div>
  <div class="card">
    <div class="budget">
      <div class="box2"><b>${spent} zł</b><span>Wydane</span></div>
      <div class="box2"><b>${left} zł</b><span>Pozostało</span></div>
      <div class="box2"><b>${total} zł</b><span>Razem</span></div>
    </div>
    ${pbar(total?Math.round(spent/total*100):0,true)}
    <div class="note">Minimum ~<b>760 zł</b>, komfortowo ~<b>1140 zł</b>. Dla kontekstu: stypendium 100% czesnego na ALK (za ≥600 pkt) = oszczędność ok. 10 000 zł/semestr.</div>
  </div>`;

  SHOP.forEach(g=>{
    html+=`<div class="section-title">${esc(g.grp)}</div><div class="card">`;
    html+=g.items.map(it=>`<div class="shop ${state.shop[it[0]]?"on":""}" data-shop="${it[0]}">
      <div class="box">${state.shop[it[0]]?"✓":""}</div>
      <div class="body"><div class="nm">${esc(it[1])}</div></div>
      <div class="pr">~${it[2]} zł</div>
    </div>`).join("");
    html+=`</div>`;
  });

  html+=`<div class="section-title">Darmowe — do pobrania (0 zł)</div><div class="card">`;
  html+=SHOP_FREE.map(it=>`<div class="shop ${state.free[it[0]]?"on":""}" data-free="${it[0]}">
    <div class="box">${state.free[it[0]]?"✓":""}</div>
    <div class="body"><div class="nm">${esc(it[1])}</div></div>
    <div class="pr">0 zł</div>
  </div>`).join("");
  html+=`</div>`;

  html+=`<div class="card"><div class="note" style="margin:0"><b>Gdzie kupić:</b> taniaksiazka.pl (najtaniej, rabaty 20–40%), allegro.pl (używane ~50%), bookcity.pl (podręczniki językowe), pazdro.com.pl, empik.com.</div></div>`;

  el.innerHTML=html;
  el.querySelectorAll("[data-shop]").forEach(s=>s.addEventListener("click",()=>{
    const id=s.dataset.shop; state.shop[id]=!state.shop[id]; save(); renderShop();
  }));
  el.querySelectorAll("[data-free]").forEach(s=>s.addEventListener("click",()=>{
    const id=s.dataset.free; state.free[id]=!state.free[id]; save(); renderShop();
  }));
}

/* ===== RENDER: LINKI ===== */
function renderLinks(){
  const el=$("#view-links");
  let html="";
  LINKS.forEach(g=>{
    html+=`<div class="section-title">${esc(g.grp)}</div>`;
    html+=g.items.map(l=>`<a class="link" href="${l[2]}" target="_blank" rel="noopener">
      <div class="nm">${esc(l[0])} ↗</div>
      <div class="ds">${esc(l[1])}</div>
      <div class="url">${esc(l[2])}</div>
    </a>`).join("");
  });
  el.innerHTML=html;
}

/* ===== EKSPORT / IMPORT / RESET ===== */
function exportJSON(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download="matura2027-backup-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function importJSON(e){
  const file=e.target.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const s=JSON.parse(r.result);
      const d=defaultState();
      state={
        topics:Object.assign(d.topics,s.topics||{}),
        jawne:typeof s.jawne==="number"?s.jawne:0,
        checks:s.checks||{}, shop:s.shop||{}, free:s.free||{}, openAcc:s.openAcc||{},
      };
      save(); renderAll();
      alert("Postęp został zaimportowany ✓");
    }catch(err){ alert("Nie udało się wczytać pliku — sprawdź, czy to poprawny backup JSON."); }
  };
  r.readAsText(file);
  e.target.value="";
}
function resetAll(){
  if(confirm("Na pewno wyczyścić cały postęp? Tego nie można cofnąć.")){
    state=defaultState(); save(); renderAll();
  }
}

/* ===== START ===== */
function renderAll(){ renderDash(); renderMap(); renderTime(); renderShop(); renderLinks(); }
function init(){
  updateCountdown();
  buildNav();
  renderAll();
}
init();
</script>
