# Copy to settings.yaml and fill in. settings.yaml is gitignored (never commit it).
# Secrets (tokens, passwords) go in .env, NOT here.

prop_firm: the5ers_high_stakes   # key from config/prop_firms.yaml
phase: p1                        # p1 | p2 | funded
account:
  initial_balance: 10000         # The5ers High Stakes $10k test account
  currency: USD
  # Broker instrument specs for sizing. For an index CFD a "pip" is one index
  # point: set pip_size to the point size and pip_value_per_lot to the money
  # value of a 1.0-lot 1-point move.
  # VERIFY on the platform: right-click symbol -> Specification -> read contract
  # size, min/step volume, tick value, OR run `python scripts/check_mt5.py
  # <symbol>` which prints exactly these values. Confirmed on a MetaQuotes-Demo
  # account 2026-07-22: US30 contract_size=1.0, tick_size=tick_value=0.01 (2
  # decimal quoting) -> pip_value_per_lot = tick_value/tick_size = $1.00 per
  # index point per 1.0 lot. volume_min=0.1, step=0.1. At 1% risk on $10k this
  # gives ~1-2.5 lots on a 40-100pt stop; min lot 0.1 fits with huge headroom.
  # Re-verify per broker — these numbers vary.
  symbol_specs:
    US30:   { pip_size: 1.0, pip_value_per_lot: 1.0, volume_min: 0.1, volume_step: 0.1, digits: 2 }
    NAS100: { pip_size: 1.0, pip_value_per_lot: 1.0, volume_min: 0.1, volume_step: 0.1, digits: 2 }

market:
  # Index CFDs (futures-like) on MT5. Symbol names vary per broker
  # (US30 / DJI30 / DE40 / GER40 / NAS100 / USTEC ...). Verify with the broker.
  symbols: [US30, NAS100]
  timeframe: M15             # decision / confirmation timeframe
  # --- Opening-range session (BROKER SERVER CLOCK) -------------------------
  # MT5 stamps every candle with the broker's server wall-clock (usually
  # GMT+2/+3), stored as an offset-less epoch — so times must be compared on
  # that clock, not local UTC. On such a feed the US cash open (New York
  # 09:30) lands at server 16:30 all year (US + EU shift DST together), and
  # these defaults are already correct. Change them ONLY if `check_mt5.py`
  # shows your broker uses a different server offset — run it, note the server
  # time it prints vs. real UTC, and shift session_open_hour accordingly.
  session_open_hour: 16      # server hour the opening range starts
  session_open_minute: 30
  cutoff_hour: 22            # no new confirmations after this server hour
  range_minutes: 30          # opening-range length (09:30-10:00 NY)
  target_r: 1.5              # take-profit as a multiple of risk
  # session_tz: UTC          # how candle timestamps are read (MT5 = UTC epoch)
  # Correlation groups: symbols in the same group count as shared exposure.
  # US indices move together, so one directional shock hits both at once.
  correlation_groups:
    us_indices: [US30, NAS100, SPX500]

execution:
  adapter: mock              # mock | mt5   (mock = paper trading, no real orders)
  deviation_points: 15       # max slippage tolerated on order send
  magic_base: 20260101       # base magic number (randomised per instance)
  # news_fail_closed: block execution when no/stale news calendar is loaded.
  # false = demo/paper can trade without a calendar (fine on demo — no payout).
  # ⚠️ SET true (and load data/calendar.json) BEFORE the real challenge —
  # The5ers penalises execution within ±2 min of high-impact news.
  news_fail_closed: false

llm:
  provider: anthropic
  model: claude-opus-4-8
  # Interval-based analysis is fine on M15/H1. Avoid sub-minute (HFT rules).
  analyze_on_candle_close: true

confirmation:
  # Require a technical confirmation before pinging Telegram for approval.
  require_technical: true
  # Optionally ask the LLM one final yes/no when the technical trigger fires.
  require_llm_final_check: true
  # Add stochastic entry delay to avoid group-trading correlation flags (ms).
  entry_jitter_ms: [500, 5000]

telegram:
  enabled: true
  # chat_id the bot is allowed to talk to (your own). Token lives in .env.
  allowed_chat_ids: []
